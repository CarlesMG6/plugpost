<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlugPost</title>
<meta name="description" content="PlugPost sustituye farolas existentes por farolas inteligentes con cargador para coche eléctrico embebido. Disponible en español, català y English.">
<meta name="robots" content="noindex,follow">
<link rel="alternate" hreflang="es" href="https://plugpost.es/es/">
<link rel="alternate" hreflang="ca" href="https://plugpost.es/ca/">
<link rel="alternate" hreflang="en" href="https://plugpost.es/en/">
<link rel="alternate" hreflang="x-default" href="https://plugpost.es/">
<link rel="icon" href="/assets/logo.png">
<script>
/* Esta página no tiene contenido propio: solo reparte a /es/, /ca/ o /en/.
   Manda la preferencia guardada; si no hay, el idioma del navegador. */
(function () {
  var target = null;
  try { target = localStorage.getItem('pp_lang'); } catch (e) {}
  if (target !== 'es' && target !== 'ca' && target !== 'en') {
    var nav = '';
    try {
      nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'es').toLowerCase();
    } catch (e) {}
    target = nav.indexOf('ca') === 0 ? 'ca' : nav.indexOf('es') === 0 ? 'es' : 'en';
  }
  location.replace('/' + target + '/' + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/es/"></noscript>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    font-family: system-ui, sans-serif;
    color: #0B1220; background: #FFFFFF;
    text-align: center; padding: 24px;
  }
  img { width: 175px; height: auto; }
  ul { list-style: none; display: flex; gap: 12px; padding: 0; margin: 0; flex-wrap: wrap; justify-content: center; }
  a {
    display: inline-block; padding: 10px 18px;
    border: 1px solid #E5E9F2; border-radius: 100px;
    color: #1F2A3D; text-decoration: none; font-weight: 600;
  }
  a:hover { background: #F6F8FC; }
</style>
</head>
<body>
<img src="/assets/logo.png" alt="PlugPost" width="349" height="200">
<ul>
  <li><a href="/es/" hreflang="es" lang="es">Español</a></li>
  <li><a href="/ca/" hreflang="ca" lang="ca">Català</a></li>
  <li><a href="/en/" hreflang="en" lang="en">English</a></li>
</ul>
</body>
</html>
